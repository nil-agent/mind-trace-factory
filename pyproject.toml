[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mind-trace-factory"
version = "0.1.0"
description = "Verifiable synthetic data generation for theory-of-mind reasoning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
